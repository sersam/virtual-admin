sonar.projectName=Administrador Virtual Inteligente
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.exclusions=**/*.test.*,**/*.spec.*,**/node_modules/**,**/dist/**,**/coverage/**,apps/api/drizzle/**/*.sql
# Entry points thin and framework-bound: main wires composition/shutdown and runMigrations only invokes the tested migration runner.
# Deployment entrypoints are covered by root node:test suites, which do not emit LCOV in this project.
sonar.coverage.exclusions=apps/api/src/main.ts,apps/api/src/infrastructure/database/runMigrations.ts,apps/web/vercel.mjs,scripts/public-smoke.mjs
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info,packages/contracts/coverage/lcov.info
sonar.sourceEncoding=UTF-8
